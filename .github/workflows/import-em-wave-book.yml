name: Import electromagnetic wave book

on:
  push:
    branches:
      - agent/import-shared-author
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-book:
    if: ${{ !contains(github.event.head_commit.message, '[book-import]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-shared-author
          fetch-depth: 0

      - name: Download production book files
        shell: bash
        run: |
          set -euo pipefail
          target='books/electromagnetic_wave'
          base='https://raw.githubusercontent.com/antarxo/HMK/agent/shared-author-cutover/book'
          mkdir -p "$target/images"
          curl --fail --location --silent --show-error "$base/chapter_content.json" --output "$target/chapter_content.json"
          curl --fail --location --silent --show-error "$base/index.html" --output "$target/index.html"
          curl --fail --location --silent --show-error "$base/Editor.html" --output "$target/Editor.html"
          curl --fail --location --silent --show-error "$base/images/orientation_axes.png" --output "$target/images/orientation_axes.png"

      - name: Convert repository-relative references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('books/electromagnetic_wave')
          path = root / 'chapter_content.json'
          data = json.loads(path.read_text(encoding='utf-8'))

          data.setdefault('meta', {}).pop('appHref', None)

          scene_count = 0
          item_count = 0
          for page in data.get('pages', []):
              for item in page.get('items', []):
                  item_count += 1
                  if item.get('type') == 'scene':
                      scene_count += 1
                      src = item.get('singleSrc')
                      if isinstance(src, str):
                          if src.startswith('../index.html'):
                              item['singleSrc'] = 'https://antarxo.github.io/HMK/index.html' + src[len('../index.html'):]
                          elif src.startswith('../electrostatic_field_book_ready.html'):
                              item['singleSrc'] = 'https://antarxo.github.io/HMK/electrostatic_field_book_ready.html' + src[len('../electrostatic_field_book_ready.html'):]
                  if item.get('type') == 'figure' and item.get('src') == '../book/images/orientation_axes.png':
                      item['src'] = 'images/orientation_axes.png'

          assert len(data.get('pages', [])) == 28, len(data.get('pages', []))
          assert item_count == 293, item_count
          assert scene_count == 10, scene_count
          assert 'appHref' not in data.get('meta', {})

          for page in data['pages']:
              for item in page.get('items', []):
                  if item.get('type') == 'scene':
                      src = item.get('singleSrc', '')
                      assert src.startswith('https://antarxo.github.io/HMK/'), src

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replacements = {
              '../author/index.html': '../../author/index.html',
              '../author/Editor.html': '../../author/Editor.html',
              '../book/chapter_content.json': '../books/electromagnetic_wave/chapter_content.json',
          }
          for name in ('index.html', 'Editor.html'):
              p = root / name
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate launchers and resources
        shell: bash
        run: |
          set -euo pipefail
          grep -F '../../author/index.html' books/electromagnetic_wave/index.html
          grep -F '../../author/Editor.html' books/electromagnetic_wave/Editor.html
          grep -F '../books/electromagnetic_wave/chapter_content.json' books/electromagnetic_wave/index.html
          grep -F '../books/electromagnetic_wave/chapter_content.json' books/electromagnetic_wave/Editor.html
          test -s books/electromagnetic_wave/images/orientation_axes.png
          ! grep -R -F '"appHref"' books/electromagnetic_wave/chapter_content.json
          test "$(grep -o 'https://antarxo.github.io/HMK/' books/electromagnetic_wave/chapter_content.json | wc -l | tr -d ' ')" = '10'

      - name: Commit imported book
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- books/electromagnetic_wave && \
             git ls-files --error-unmatch books/electromagnetic_wave/chapter_content.json >/dev/null 2>&1; then
            echo 'Book already imported.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/electromagnetic_wave
          git commit -m '[book-import] Import electromagnetic wave production book'
          git push origin HEAD:agent/import-shared-author
