name: Apply strict book.json contract

on:
  push:
    branches:
      - agent/book-json-identity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[book-json-contract]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/book-json-identity
          fetch-depth: 0

      - name: Decode and verify migration patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/book-json.patch.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/book-json.patch.gz.b64 > /tmp/book-json.patch.gz
          echo 'c1c74839cb578ad3fb2d8e6cd4bfad10cbfb79c3040bd96b9186a4e5b416bc49  /tmp/book-json.patch.gz' | sha256sum -c -
          gunzip -c /tmp/book-json.patch.gz > /tmp/book-json.patch
          git apply --check /tmp/book-json.patch

      - name: Apply strict contract
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/book-json.patch
          node tools/validate-book-contract.mjs
          test -f books/electromagnetic_wave/book.json
          test ! -e books/electromagnetic_wave/chapter_content.json
          grep -q "BOOK_FILE_NAME='book.json'" author/index.html
          grep -q "BOOK_FILE_NAME='book.json'" author/Editor.html
          grep -q "const VERSION = '0.3.0'" author/book-core.js

      - name: Commit verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-book-json-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[book-json-contract] Enforce strict book.json identity'
          git push origin HEAD:agent/book-json-identity
