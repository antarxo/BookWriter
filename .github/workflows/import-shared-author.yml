name: Import complete shared author

on:
  push:
    branches:
      - agent/import-shared-author
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-author:
    if: ${{ !contains(github.event.head_commit.message, '[author-import-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-shared-author
          fetch-depth: 0

      - name: Download canonical author from HMK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p author
          base='https://raw.githubusercontent.com/antarxo/HMK/agent/shared-author-cutover/author'
          files=(
            'CHANGELOG_ΕΛ.md'
            'Editor.html'
            'README_ΕΛ.md'
            'RELEASE.json'
            'SCENE_PROTOCOL_ΕΛ.md'
            'book-core.css'
            'book-core.js'
            'book-schema-v1.schema.json'
            'index.html'
            'snapshot-transport.js'
          )
          for file in "${files[@]}"; do
            curl --fail --location --silent --show-error "$base/$file" --output "author/$file"
          done

      - name: Verify exact Git blob hashes
        shell: bash
        run: |
          set -euo pipefail
          git_blob_sha() {
            local file="$1"
            local size
            size=$(wc -c < "$file" | tr -d ' ')
            { printf 'blob %s\0' "$size"; cat "$file"; } | sha1sum | awk '{print $1}'
          }
          test "$(git_blob_sha author/CHANGELOG_ΕΛ.md)" = 'b3b1ae5f1971da2e8c9aaae6e1597917ca4eeb24'
          test "$(git_blob_sha author/Editor.html)" = 'ea323358aa3ebe0f6154c99f6b4daf8e23ef745c'
          test "$(git_blob_sha author/README_ΕΛ.md)" = '08686eb304d4fa74111dfd4533c342edd7ab1e4e'
          test "$(git_blob_sha author/RELEASE.json)" = '8437385f4ef9229d2ca2f2db1ba82ac7d239e9a3'
          test "$(git_blob_sha author/SCENE_PROTOCOL_ΕΛ.md)" = '007cc2d836c241bc62fa9712a5470b26e6e74a57'
          test "$(git_blob_sha author/book-core.css)" = '92c152ff2c241844eff4c64b57f3d84e1a6b4e3e'
          test "$(git_blob_sha author/book-core.js)" = '7aba2ee1740990058dd39b3faa58438aee9302a0'
          test "$(git_blob_sha author/book-schema-v1.schema.json)" = '91cd6ce1f91112e6d28d994c15425f13420e5f17'
          test "$(git_blob_sha author/index.html)" = '7e3bd2d79c83e9fec5e1f5e8e1701ef2a9b6065c'
          test "$(git_blob_sha author/snapshot-transport.js)" = 'c2c5d286d9992f7f8259b2d5dce187e4f919ff3e'

      - name: Commit complete author import
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- author && git ls-files --error-unmatch \
            author/CHANGELOG_ΕΛ.md \
            author/Editor.html \
            author/README_ΕΛ.md \
            author/RELEASE.json \
            author/SCENE_PROTOCOL_ΕΛ.md \
            author/book-core.css \
            author/book-core.js \
            author/book-schema-v1.schema.json \
            author/index.html \
            author/snapshot-transport.js >/dev/null 2>&1; then
            echo 'Complete author already imported.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add author
          git commit -m '[author-import-complete] Import complete shared General Author from HMK'
          git push origin HEAD:agent/import-shared-author
