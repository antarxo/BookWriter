<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookWriter — Βιβλίο</title>
  <link rel="icon" href="data:,">
<style>
:root{
  --bg:#ece6d9;
  --paper:#fffdf9;
  --ink:#1d2730;
  --muted:#5e6d79;
  --line:#ddd3c3;
  --accent:#1f5f8b;
  --accent-soft:#e7f0f6;
  --note:#f6efdc;
  --figure:#f6f8fa;
  --sheet-width:794px;
  --sheet-height:1123px;
  --sheet-pad-top:54px;
  --sheet-pad-right:44px;
  --sheet-pad-bottom:54px;
  --sheet-pad-left:44px;
  --screen-scale:1;
  --shadow:0 18px 36px rgba(0,0,0,.10);
  --shape-width:340px;
  --body-font-size:18px;
  --body-leading:1.3;
  --para-gap:6px;
  --section-gap:14px;
  --note-gap:8px;
  --callout-gap:7px;
  --header-top:20px;
  --header-h:16px;
  --footer-bottom:18px;
  --footer-h:16px;
  --header-font-size:0px;
  --footer-font-size:0px;
  --body-font-family:Georgia,"Noto Serif",serif;
  --heading-font-family:Georgia,"Noto Serif",serif;
  --hero-eyebrow-font-size:13px;
  --hero-title-font-size:28px;
  --hero-subtitle-font-size:16px;
  --hero-title-font-family:Georgia,"Times New Roman",serif;
  --part-kicker-font-size:10px;
  --part-title-font-size:24px;
  --part-title-font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --section-heading-font-size:18px;
  --section-heading-font-family:Georgia,"Noto Serif",serif;
  --note-font-size:14px;
  --note-line-height:1.42;
  --note-label-font-size:10.5px;
  --caption-font-size:12px;
  --callout-font-size:11.5px;
  --callout-title-font-size:10.5px;
  --callout-label-font-size:10px;
  --callout-chip-font-size:10px;
  --callout-observe-title-font-size:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#efe9dc 0,#ece6d9 120px);
  color:var(--ink);
  font-size:var(--body-font-size);
  line-height:var(--body-leading);
  font-family:var(--body-font-family);
}
a{color:#1f5f8b;text-decoration-thickness:.08em;text-underline-offset:.14em}
a:hover{color:#173f5b}
.page a[href^="#"]{font-weight:650}
@media print{a{color:inherit;text-decoration:none}}
.topbar{
  position:sticky; top:0; z-index:30;
  backdrop-filter:blur(10px);
  background:rgba(236,230,217,.88);
  border-bottom:1px solid rgba(0,0,0,.08);
}
.topbar-inner{
  max-width:1200px; margin:0 auto; padding:10px 18px;
}
.lang-tools{display:flex;justify-content:flex-end;align-items:center;gap:8px;max-width:var(--sheet-width);margin:0 auto 8px;flex-wrap:wrap}
.reader-zoom-tools{display:inline-flex;align-items:center;gap:5px;margin-right:auto}.reader-zoom-tools button{border:1px solid rgba(0,0,0,.16);background:#fff;color:var(--ink);height:31px;min-width:34px;padding:0 9px;border-radius:10px;font:700 12px system-ui;cursor:pointer}.reader-zoom-tools button:hover{background:#f0f6fa}.reader-zoom-value{min-width:48px;text-align:center;font:700 12px system-ui;color:var(--muted)}
.lang-btn{border:1px solid rgba(0,0,0,.12);background:#fff;color:var(--ink);padding:8px 12px;border-radius:14px;font:700 12px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;cursor:pointer}
.lang-btn.active{background:#f7fafc;border-color:#cfd8e0;color:#173f5b}
.mega-nav{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
  align-items:stretch;
  justify-content:center;
  width:100%;
  max-width:var(--sheet-width);
  margin:0 auto;
}
.menu-item{position:relative;min-width:0}
.menu-item::after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;background:transparent}
.menu-trigger,.menu-btn{
  display:flex; width:100%; min-width:0; align-items:center; justify-content:center; gap:7px;
  border:1px solid rgba(0,0,0,.12); background:#fff; color:var(--ink);
  padding:10px 12px; border-radius:18px; font:700 13px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  text-decoration:none; white-space:nowrap; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.04); cursor:pointer;
}
.menu-trigger .caret{font-size:11px;color:var(--muted)}
.menu-item.active .menu-trigger,.menu-item:hover>.menu-trigger,.menu-item:focus-within>.menu-trigger,.menu-btn:hover{
  background:#f7fafc;border-color:#cfd8e0;color:#173f5b
}
.menu-dropdown{
  position:absolute;left:0;top:calc(100% + 2px);min-width:100%;width:max-content;display:none;
  padding:10px;background:#fffdf9;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.12);z-index:35
}
.menu-item:hover>.menu-dropdown,.menu-item:focus-within>.menu-dropdown,.menu-item.open>.menu-dropdown{display:block}
.menu-dropdown .menu-section-link{
  display:block;text-decoration:none;color:var(--ink);background:#faf8f3;border:1px solid rgba(0,0,0,.06);
  border-radius:12px;padding:10px 12px;font:650 13px/1.35 system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0 0 8px
}
.menu-dropdown .menu-section-link:last-child{margin-bottom:0}
.menu-item.menu-tool::after{display:none}
.viewport{max-width:1200px; margin:0 auto; padding:24px 18px 60px}
.page-stack{display:flex; flex-direction:column; align-items:center; gap:26px}
.print-preparing-overlay{
  position:fixed; inset:0; z-index:2000; display:none; place-items:center;
  background:rgba(7,10,13,.96); backdrop-filter:blur(9px) saturate(120%);
  font:700 16px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif; color:#f4f7fb;
}
.print-preparing .print-preparing-overlay{display:grid}
.print-preparing-card{
  width:min(420px,calc(100vw - 36px)); padding:24px 26px; border:1px solid rgba(255,255,255,.26);
  border-radius:8px; background:rgba(255,255,255,.12); box-shadow:0 24px 70px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.20); text-align:center;
  backdrop-filter:blur(18px) saturate(135%);
}
.print-preparing-title{margin:0 0 8px;font-size:18px}
.print-preparing-text{margin:0;color:rgba(244,247,251,.78);font-weight:650}
.print-progress{
  height:8px; margin:18px 0 10px; border:1px solid rgba(255,255,255,.22); border-radius:999px;
  background:rgba(255,255,255,.10); overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.28);
}
.print-progress-bar{
  height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg,#67e8f9,#86efac,#fde68a);
  box-shadow:0 0 18px rgba(103,232,249,.38); transition:width .22s ease;
}
.print-progress-label{
  margin:0; color:rgba(244,247,251,.68);
  font:650 12px/1.35 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
.sheet-wrap{
  width:calc(var(--sheet-width) * var(--screen-scale));
  min-height:calc(var(--sheet-height) * var(--screen-scale));
  position:relative;
}
.sheet{
  width:var(--sheet-width);
  height:var(--sheet-height);
  min-height:var(--sheet-height);
  transform:scale(var(--screen-scale));
  transform-origin:top left;
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  position:absolute; left:0; top:0;
  overflow:hidden;
}
.sheet-inner{
  position:relative;
  height:100%;
  min-height:100%;
  padding:var(--sheet-pad-top) var(--sheet-pad-right) var(--sheet-pad-bottom) var(--sheet-pad-left);
}
.sheet-header{
  position:absolute;
  left:var(--sheet-pad-left);
  right:var(--sheet-pad-right);
  top:var(--header-top);
  height:var(--header-h);
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  align-items:center;
  border-bottom:1px solid rgba(0,0,0,.08);
  padding-bottom:8px;
  font:700 var(--header-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  letter-spacing:.04em;
  text-transform:none;
  color:#7f8890;
}
.sheet-header .c{text-align:center}
.sheet-header .r{text-align:right}
.sheet-header.hidden{display:none}
.sheet-body{
  display:flow-root;
}
.sheet-footer{
  position:absolute;
  left:var(--sheet-pad-left);
  right:var(--sheet-pad-right);
  bottom:var(--footer-bottom);
  height:var(--footer-h);
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  align-items:center;
  padding-top:8px;
  border-top:1px solid rgba(0,0,0,.08);
  font:600 var(--footer-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:#7b8791;
}
.sheet-footer .c{text-align:center}
.sheet-footer .r{text-align:right}
.sheet-footer.hidden{display:none}

.hero{margin:0 0 var(--section-gap)}
.eyebrow{margin:0 0 10px;font:800 var(--hero-eyebrow-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-transform:none;letter-spacing:.08em;color:var(--accent)}
h1{margin:0 0 10px;font-family:var(--hero-title-font-family);font-size:var(--hero-title-font-size);line-height:1.06;letter-spacing:-.016em;font-weight:760;color:#1b506f}
.subtitle{margin:0;color:var(--muted);font-size:var(--hero-subtitle-font-size);line-height:1.35;max-width:56ch}

.part-head{margin:18px 0 14px;padding-top:2px}
.part-kicker{margin:0 0 5px;font:800 var(--part-kicker-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-transform:none;letter-spacing:.11em;color:#8a6a32}
.part-title-main{margin:0;font:780 var(--part-title-font-size)/1.08 var(--part-title-font-family);letter-spacing:-.022em;color:#2f627f}

.section-heading{margin:20px 0 8px;padding-top:6px;border-top:1px solid rgba(0,0,0,.06);font:700 var(--section-heading-font-size)/1.18 var(--section-heading-font-family);letter-spacing:-.008em;color:#5d7281}
.paragraph{margin:0 0 var(--para-gap);text-align:justify;text-justify:inter-word;hyphens:auto}
.note{
  margin:var(--note-gap) 0; padding:10px 12px; border-radius:14px; background:var(--note); border:1px solid #e4d7ae;
  font:500 var(--note-font-size)/var(--note-line-height) system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
.note .label{display:block;margin:0 0 5px;font:800 var(--note-label-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;letter-spacing:.08em;text-transform:none;color:#8d6d1c}
.side-note{
  margin:4px 0 12px; padding:10px 12px; border-radius:16px;
  background:#f7fafc; border:1px solid #d6e2eb; color:#29414f;
  font:500 var(--note-font-size)/var(--note-line-height) system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
.side-note.float-right,.side-note.float-left{width:min(var(--figure-width, var(--shape-width)), 42%)}
.side-note.float-right{float:right;margin:4px 0 10px 18px}
.side-note.float-left{float:left;margin:4px 18px 10px 0}
.side-note.wide{clear:both;width:100%;max-width:100%;margin:14px 0}
.side-note .label{display:block;margin:0 0 6px;font:800 var(--note-label-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;letter-spacing:.08em;text-transform:none;color:#2f698f}
.side-note .title{display:block;margin:0 0 6px;font:800 13px/1.25 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1f5f8b}
.side-note p{margin:0 0 6px}
.side-note p:last-child{margin-bottom:0}

figure.media{
  margin:4px 0 12px; background:var(--figure); border:1px solid var(--line); border-radius:16px; overflow:hidden;
}
figure.media.float-right,figure.media.float-left{width:min(var(--figure-width, var(--shape-width)), 42%)}
figure.media.float-right{float:right;margin:4px 0 10px 18px}
figure.media.float-left{float:left;margin:4px 18px 10px 0}
figure.media.wide{clear:both;width:100%;max-width:100%;margin:14px 0}
.media-frame{position:relative;width:100%;background:#dde7ee;overflow:hidden;aspect-ratio:16/9}
.media-frame.natural{aspect-ratio:auto;background:#fff;overflow:visible}
.media-frame iframe,.media-frame img,.media-placeholder,.print-scene-snapshot{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.media-frame img{object-fit:cover}
.media-frame.natural img{position:static;inset:auto;width:100%;height:auto;object-fit:contain;display:block}
.media-placeholder{display:grid;place-items:center;text-align:center;padding:22px;background:linear-gradient(135deg,#f7fbfd,#e1ebf1);color:#465666;font:600 15px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.print-scene-snapshot{display:none;object-fit:contain;background:#fff}
figcaption{padding:12px 14px 14px;font:500 var(--caption-font-size)/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--muted);border-top:1px solid rgba(0,0,0,.07)}

.callout{
  margin:var(--callout-gap) 0; padding:8px 9px; border:1px solid #d6e2eb; border-radius:12px; background:#f8fbfd;
  font:500 var(--callout-font-size)/1.35 system-ui,-apple-system,Segoe UI,Arial,sans-serif; color:#29414f;
}
.callout-title{margin:0 0 6px;font:800 var(--callout-title-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-transform:none;letter-spacing:.08em;color:#2f698f}
.callout-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px}
.callout-label{font:700 var(--callout-label-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#5a7386;padding:3px 6px;border-radius:999px;background:#eef4f8;border:1px solid #d7e4ec}
.callout-chip{display:inline-flex;align-items:center;justify-content:center;min-height:20px;padding:3px 7px;border-radius:999px;background:#fff;border:1px solid #d6e2eb;font:700 var(--callout-chip-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#203848}
.callout-observe{margin-top:4px;padding-top:5px;border-top:1px dashed #cfdbe3}
.callout-observe-title{font:700 var(--callout-observe-title-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#7b5c2a;margin-right:6px}
.callout-observe ul{margin:6px 0 0 18px;padding:0}
.callout-observe li{margin:4px 0;font-style:italic}
.callout-conclusion{margin-top:5px;padding-top:5px;border-top:1px solid #d7e4dc;background:#f7fcf9}
.callout-conclusion-title{font:800 var(--callout-observe-title-font-size)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1f6b46;margin-right:6px}
.callout-conclusion ul{margin:6px 0 0 18px;padding:0}
.callout-conclusion li{margin:4px 0;font-weight:600}
.callout-extras{margin-top:7px;padding-top:6px;border-top:1px solid #d4dfeb}
.callout-extras-toggle{appearance:none;border:1px solid #b8cad8;background:#eef6fb;color:#244b65;border-radius:999px;padding:4px 10px;font:800 10.5px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;cursor:pointer}
.callout-extras-toggle::after{content:" +";font-weight:900}
.callout-extras:not(.collapsed) .callout-extras-toggle::after{content:" -"}
.callout-extras-body{margin-top:7px;display:grid;gap:7px}
.callout-extra-item{padding:7px 8px;border:1px solid #d8e3ea;background:#fff;border-radius:6px}
.callout-extra-item b{display:block;margin-bottom:3px;color:#31556c;font:800 10.5px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.callout-extra-item p{margin:0}
.callout-extra-answer-toggle{appearance:none;margin-top:6px;border:1px solid #b8cad8;background:#f4f9fc;color:#244b65;border-radius:999px;padding:4px 9px;font:800 10px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;cursor:pointer}
.callout-extra-answer{margin-top:6px;padding:7px 8px;border-left:3px solid #6aa0bf;background:#f5fafc;color:#263d4c;border-radius:4px}
.callout-extra-lines{display:grid;gap:9px;margin-top:8px}
.callout-extra-lines span{display:block;border-bottom:1px solid #aebbc5;height:12px}
@media screen{.callout-extras-body[hidden],.callout-extra-answer[hidden]{display:none!important}}
.callout-sequence{padding:7px 8px}
.callout-sequence-head{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 7px}
.callout-sequence-dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.callout-sequence-arrow,.callout-sequence-dot{appearance:none;border:1px solid #c8d8e2;background:#fff;color:#29414f;border-radius:999px;min-width:24px;height:24px;padding:0 7px;font:800 11px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.callout-sequence-dot.active{background:#2f698f;color:#fff;border-color:#2f698f}
.callout-sequence-step{display:none}
.callout-sequence-step.active{display:block}
.clear{clear:both}
.nav-anchor{display:block;position:relative;height:0;overflow:hidden;scroll-margin-top:120px}
.sheet-wrap[id],.sheet-body [id],.nav-anchor[id]{scroll-margin-top:120px}
.status{max-width:var(--sheet-width);margin:16px auto 0;color:var(--muted);font:500 14px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.local-book-loader{max-width:680px;margin:24px auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fffdf9;text-align:center;font:600 14px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.local-book-loader input{display:block;margin:12px auto 0}
.reader-scroll-nav{
  position:fixed;
  right:clamp(8px,2vw,24px);
  top:50%;
  transform:translateY(-50%);
  z-index:28;
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:7px;
  border:1px solid rgba(0,0,0,.14);
  border-radius:18px;
  background:rgba(255,253,249,.78);
  box-shadow:0 16px 34px rgba(0,0,0,.14);
  backdrop-filter:blur(12px) saturate(130%);
}
.reader-scroll-nav button{
  width:38px;
  height:38px;
  border:1px solid rgba(31,95,139,.22);
  border-radius:13px;
  background:#fff;
  color:#17425f;
  display:grid;
  place-items:center;
  font:800 18px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  cursor:pointer;
  box-shadow:0 5px 14px rgba(31,95,139,.10);
}
.reader-scroll-nav button:hover{background:#f0f7fb;border-color:#9fbdd0}
.reader-scroll-nav button:focus-visible{outline:3px solid rgba(47,105,143,.28);outline-offset:2px}
.reader-scroll-nav button:disabled{opacity:.36;cursor:default;box-shadow:none}

.math-inline math{font-size:1em}
.math-block{display:block;margin:5px 0;text-align:center}
.math-source-error{display:inline-block;padding:1px 4px;border:1px solid #d39a9a;border-radius:4px;background:#fff1f1;color:#8a1f1f;font-family:ui-monospace,Consolas,monospace;font-size:.92em}
@media (max-width:980px){
  .mega-nav{grid-template-columns:repeat(3,minmax(120px,1fr))}
}
@media (max-width:760px){
  .mega-nav{grid-template-columns:repeat(2,minmax(120px,1fr))}
  .menu-dropdown{position:static;display:block;min-width:0;width:100%;margin-top:8px}
}
@media (max-width:640px){
  .reader-scroll-nav{right:8px;gap:5px;padding:5px;border-radius:14px}
  .reader-scroll-nav button{width:32px;height:32px;border-radius:11px;font-size:15px}
}
@media print{
  @page{size:A4 portrait; margin:0}
  html,body{background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{
    font-size:var(--body-font-size) !important;
    line-height:var(--body-leading) !important;
    font-family:var(--body-font-family) !important;
  }
  .topbar,.status,.local-book-loader,.print-preparing-overlay,.reader-scroll-nav{display:none !important}
  .viewport{padding:0 !important; max-width:none !important}
  .page-stack{gap:0 !important}
  .sheet-wrap{
    width:var(--sheet-width) !important;
    min-height:var(--sheet-height) !important;
    page-break-after:always;
    break-after:page;
    break-inside:avoid;
    overflow:visible !important;
  }
  .sheet-wrap:last-child{page-break-after:auto;break-after:auto}
  .sheet{
    width:var(--sheet-width) !important;
    height:var(--sheet-height) !important;
    min-height:var(--sheet-height) !important;
    transform:none !important;
    position:relative !important;
    left:auto !important;
    top:auto !important;
    border:1px solid transparent !important;
    box-shadow:none !important;
    overflow:hidden !important;
  }
  .sheet-inner{
    height:100% !important;
    min-height:100% !important;
    padding:var(--sheet-pad-top) var(--sheet-pad-right) var(--sheet-pad-bottom) var(--sheet-pad-left) !important;
  }
  .sheet-header{
    left:var(--sheet-pad-left) !important;
    right:var(--sheet-pad-right) !important;
    top:var(--header-top) !important;
    height:var(--header-h) !important;
    font-size:var(--header-font-size) !important;
  }
  .sheet-footer{
    left:var(--sheet-pad-left) !important;
    right:var(--sheet-pad-right) !important;

async function captureIframeDirect(iframe, timeoutMs=1200){

      };
    }

      requestedPath:SNAPSHOT_PATHS.BOOK_SCENE_V1,
      executedPath:SNAPSHOT_PATHS.BOOK_SCENE_V1,

      reason:null,

async function captureIframeFast(iframe, options={}){

    timeoutMs:options.timeoutMs

  if(direct?.attempts?.length){
    viaMessage.attempts = [...direct.attempts, ...(viaMessage.attempts || [])];

async function captureIframeWithRetry(iframe, options={}){
  const maxAttempts = Math.max(1, Number(options.attempts) || 1);
  const mergedAttempts = [];
  let lastResult = null;
  let bestResult = null;
  const accepts = typeof options.accepts === 'function' ? options.accepts : (()=>true);
  for(let attemptIndex=0; attemptIndex<maxAttempts; attemptIndex++){
    lastResult = await captureIframeFast(iframe, {
      timeoutMs:options.timeoutMs,
      directTimeoutMs:options.directTimeoutMs
    });
    mergedAttempts.push(...lastResult.attempts.map(attempt=>({
      ...attempt,
      attemptIndex:attemptIndex+1
    })));
    if(lastResult.result === 'success'){
      const accepted = accepts(lastResult);
      if(accepted) return { ...lastResult, attempts:mergedAttempts, bestOf:attemptIndex+1 };
      if(!bestResult || String(lastResult.dataUrl||'').length > String(bestResult.dataUrl||'').length) bestResult = lastResult;
    }else if(lastResult.reason === 'timeout' || lastResult.reason === 'scene-load-error' || lastResult.reason === 'iframe-unavailable'){
      break;
    }
    if(attemptIndex < maxAttempts-1) await wait(Number(options.retryDelayMs)||450);
  }
  if(bestResult){
    return { ...bestResult, attempts:mergedAttempts, bestOf:maxAttempts };
  }
  return {
    ...(lastResult || {
      requestedPath:SNAPSHOT_PATHS.BOOK_SCENE_V1,
      executedPath:null,
      result:'failure',
      reason:'no-attempt',
      fallbackUsed:false,
      dataUrl:null

    attempts:mergedAttempts

}

function sceneSnapshotGraphPass(result){

async function captureSceneFrame(frame){

    timeoutMs,
    directTimeoutMs:Math.max(600, Math.min(5000, Number(frame?.dataset?.snapshotDirectTimeoutMs) || 1200)),
    retryDelayMs,

}

async function buildPrintBookFromSource(source){

  if(!globalThis.BookPaginationV4?.paginateBook) return expanded;
  const paged = await BookPaginationV4.paginateBook(expanded,{
    imageCandidates:src=>imageSrcCandidates(src),
    sceneSource:src=>withCacheBust(normalizeAppSrc(src)),
    rejectOverflow:false,
    tolerancePx:1,
    assetTimeout:2200
  });
  const book = paged.book || expanded;
  book.extensions = {
    ...(book.extensions || {}),
    printSequenceExpansion:{
      ...(expanded.extensions?.printSequenceExpansion || {}),
      paginated:true,
      sourcePages:(expanded.pages||[]).length,

async function ensurePrintSequenceExpansion(){

async function beginPrintFlow(){

  activePrintSession = {state:captureReaderState()};
  showPrintPreparingOverlay();
  updatePrintProgress(8, printProgressText('saving'));
  setStatus('Ετοιμάζονται στατικά στιγμιότυπα για την εκτύπωση…');
  let snapshotWarning = false;
  try{
    await nextFrame();
    updatePrintProgress(14, printProgressText('expanding'));
    await ensurePrintSequenceExpansion();
    await nextFrame();
    await preparePrintSnapshots({
      force:true,
      onProgress:(info={})=>{
        const total = Math.max(1, Number(info.total) || 1);
        if(info.stage === 'images'){
          updatePrintProgress(18, describeSnapshotProgress(info));
          return;
        }
        if(info.stage === 'scene' || info.stage === 'scenes'){
          const done = Math.max(0, Math.min(total, Number(info.done) || 0));
          updatePrintProgress(22 + (done / total) * 68, describeSnapshotProgress(info));
          return;
        }
        if(info.stage === 'finalize'){

        }

      snapshotWarning = true;

    ? (contentLang==='en'

    : '');

  appendNavTools(data);
  wireNavMenuInteractions();
  wireInTextInternalLinks();
  megaNav.dataset.pageGroupMap = JSON.stringify(Object.fromEntries(pageToGroup));
}

function deriveManualNav(data){
  const pages = Array.isArray(data.pages) ? data.pages : [];
  const {byId: targetMap} = collectNavTargets(data);
  const rawGroups = Array.isArray(data?.nav?.groups) ? data.nav.groups : [];
  const visibleGroups = rawGroups
    .map((group, idx) => {
      const fallbackId = pages[0]?.id || 'page-1';
      const id = String(group.target || group.targetId || group.id || fallbackId).trim() || fallbackId;
      const target = targetMap.get(id);
      const entries = Array.isArray(group.entries) ? group.entries : [];
      return {
        key: `manual-${idx}`,
        id,
        pageId: target?.pageId || id,
        title: String(getLoc(group,'title', group.title || target?.title || id || `Menu ${idx+1}`)).trim() || id,
        hidden: !!group.hidden,
        entries: entries.map(entry => {
          const entryId = String(entry.target || entry.targetId || entry.id || id).trim() || id;
          const entryTarget = targetMap.get(entryId);
          return {
            id: entryId,
            pageId: entryTarget?.pageId || entryId,
            text: String(getLoc(entry,'title', entry.title || entryTarget?.title || entryId)).trim() || entryId,
            hidden: !!entry.hidden
          };
        })
      };
    })
    .filter(group => group.title && group.id);

  const groups = visibleGroups.length ? visibleGroups : [{
    key:'manual-0',
    id:pages[0]?.id || 'page-1',
    pageId:pages[0]?.id || 'page-1',
    title:contentLang==='en' ? 'Book' : 'Βιβλίο',
    entries:[]
  }];

  const pageToGroup = new Map();
  const anchors = groups.map((g, idx)=>({
    key:g.key,
    index:targetPageIndex(g.id, targetMap, idx)
  })).sort((a,b)=>a.index-b.index);

  pages.forEach((page, idx)=>{
    const pageId = page.id || `page-${idx+1}`;
    let active = anchors[0]?.key || groups[0].key;
    for(const a of anchors){
      if(a.index <= idx) active = a.key;
      else break;
    }
    pageToGroup.set(pageId, active);
  });
  groups.forEach(group => {
    if(group.id) pageToGroup.set(group.id, group.key);
    if(group.pageId) pageToGroup.set(group.pageId, group.key);
    (group.entries || []).forEach(entry => {
      if(entry.id) pageToGroup.set(entry.id, group.key);
      if(entry.pageId) pageToGroup.set(entry.pageId, group.key);
    });
  });

  renderNavGroups(groups, pageToGroup, data);
}

function deriveNav(data){
  if(data?.nav?.mode === 'manual' && Array.isArray(data?.nav?.groups) && data.nav.groups.length){
    deriveManualNav(data);
    return;
  }
  const pages = Array.isArray(data.pages) ? data.pages : [];
  const groups = [];
  const pageToGroup = new Map();
  let currentGroup = null;

  function menuGroupTitle(groupIndex, page, partItem){
    if(partItem && String(itemNavTitle(partItem,'')).trim()) return String(itemNavTitle(partItem,'')).trim();
    const right = String(BookCore.resolvePageFrame(data,page,groupIndex).header.right || '').trim();
    const firstTitle = (page?.items || []).map(item=>itemNavTitle(item,'')).find(Boolean);
    const bookTitle = groupIndex === 0 ? String(getLoc(data?.meta,'title','')).trim() : '';
    return right || firstTitle || bookTitle || (contentLang==='en' ? `Page ${groupIndex+1}` : `Σελίδα ${groupIndex+1}`);
  }

  pages.forEach((page, idx) => {
    const pageId = page.id || `page-${idx+1}`;
    const partIndex = (page.items || []).findIndex(it => it.type === 'part_title' && BookCore.itemNavVisible(it));
    const partItem = partIndex >= 0 ? page.items[partIndex] : null;
    const startsNewGroup = !currentGroup || !!partItem;

    if(startsNewGroup){
      const groupId = partItem ? itemAnchorId(page, idx, partItem, partIndex) : pageId;
      currentGroup = {
        key: `group-${groups.length}`,
        id: groupId,
        pageId,
        title: menuGroupTitle(groups.length, page, partItem),
        entries: [],
        seen: new Set()
      };
      groups.push(currentGroup);
    }

    pageToGroup.set(pageId, currentGroup.key);

    (page.items || []).forEach((it, itemIndex) => {
      if(!BookCore.itemNavVisible(it)) return;
      const raw = String(itemNavTitle(it,'')).trim();
      if(!raw) return;
      if(!['section_heading','scene','nav_anchor'].includes(it.type)) return;
      const key = raw.toLowerCase();
      if(currentGroup.seen.has(key)) return;
      currentGroup.seen.add(key);
      currentGroup.entries.push({ id:itemAnchorId(page, idx, it, itemIndex) || pageId, pageId, text:raw });
    });

    if(currentGroup.entries.length === 0){
      const key = currentGroup.title.toLowerCase();
      currentGroup.seen.add(key);
      currentGroup.entries.push({ id:currentGroup.id || pageId, pageId, text:currentGroup.title });
    }
  });

  groups.forEach(group => {
    if(group.id) pageToGroup.set(group.id, group.key);
    if(group.pageId) pageToGroup.set(group.pageId, group.key);
    (group.entries || []).forEach(entry => {
      if(entry.id) pageToGroup.set(entry.id, group.key);
      if(entry.pageId) pageToGroup.set(entry.pageId, group.key);
    });
  });
  groups.forEach(g=>delete g.seen);
  renderNavGroups(groups, pageToGroup, data);
}
function updateActiveNav(){
  const targetEls=Array.from(document.querySelectorAll('.sheet-wrap[id], .sheet-body .nav-anchor[id]'));
  const y=window.scrollY + 140;
  let activeId='';
  for(const el of targetEls){
    if(el.getBoundingClientRect().top + window.scrollY <= y) activeId=el.id;
  }
  let pageToGroup = {};
  try{ pageToGroup = JSON.parse(megaNav.dataset.pageGroupMap || '{}'); }catch(_e){}
  let activeGroupKey = pageToGroup[activeId] || '';
  if(!activeGroupKey){
    const el = activeId ? document.getElementById(activeId) : null;
    const page = el?.closest?.('.sheet-wrap[id]');
    activeGroupKey = page ? pageToGroup[page.id] || '' : '';
  }
  megaNav.querySelectorAll('.menu-item').forEach(node=>{
    if(node.dataset.groupKey){
      node.classList.toggle('active', node.dataset.groupKey === activeGroupKey);
    }
  });
}
window.addEventListener('scroll', updateActiveNav, {passive:true});

async function loadData(){
  const source=configuredBookUrl();
  setBookSourceUrl(source);
  const res=await fetch(source, {cache:'no-store'});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}
function fontPresetValue(key, fallback){
  const presets = {
    serif: 'Georgia,"Noto Serif","Times New Roman",serif',
    sans: 'system-ui,-apple-system,"Segoe UI",Arial,sans-serif',
    classic: '"Avenir Next","Segoe UI",system-ui,-apple-system,Arial,sans-serif'
  };
  return presets[key] || fallback;
}
function applyLayoutDefaults(defs){
  const root = document.documentElement;
  if(!defs || typeof defs !== 'object') return;
  if(defs.pageWidthPx != null) root.style.setProperty('--sheet-width', `${Number(defs.pageWidthPx)}px`);
  if(defs.pageHeightPx != null) root.style.setProperty('--sheet-height', `${Number(defs.pageHeightPx)}px`);
  if(defs.pagePaddingTopPx != null) root.style.setProperty('--sheet-pad-top', `${Number(defs.pagePaddingTopPx)}px`);
  if(defs.pagePaddingRightPx != null) root.style.setProperty('--sheet-pad-right', `${Number(defs.pagePaddingRightPx)}px`);
  if(defs.pagePaddingBottomPx != null) root.style.setProperty('--sheet-pad-bottom', `${Number(defs.pagePaddingBottomPx)}px`);
  if(defs.pagePaddingLeftPx != null) root.style.setProperty('--sheet-pad-left', `${Number(defs.pagePaddingLeftPx)}px`);
  if(defs.bodyFontSize != null) root.style.setProperty('--body-font-size', `${Number(defs.bodyFontSize)}px`);
  if(defs.lineHeight != null) root.style.setProperty('--body-leading', String(defs.lineHeight));
  if(defs.paragraphGap != null) root.style.setProperty('--para-gap', `${Number(defs.paragraphGap)}px`);
  if(defs.sectionGap != null) root.style.setProperty('--section-gap', `${Number(defs.sectionGap)}px`);
  if(defs.noteGap != null) root.style.setProperty('--note-gap', `${Number(defs.noteGap)}px`);
  if(defs.calloutGap != null) root.style.setProperty('--callout-gap', `${Number(defs.calloutGap)}px`);
  if(defs.headerTopPx != null) root.style.setProperty('--header-top', `${Number(defs.headerTopPx)}px`);
  if(defs.headerHeightPx != null) root.style.setProperty('--header-h', `${Number(defs.headerHeightPx)}px`);
  if(defs.footerBottomPx != null) root.style.setProperty('--footer-bottom', `${Number(defs.footerBottomPx)}px`);
  if(defs.footerHeightPx != null) root.style.setProperty('--footer-h', `${Number(defs.footerHeightPx)}px`);
  if(defs.headerFontSize != null) root.style.setProperty('--header-font-size', `${Number(defs.headerFontSize)}px`);
  if(defs.footerFontSize != null) root.style.setProperty('--footer-font-size', `${Number(defs.footerFontSize)}px`);
  if(defs.bodyFontFamily != null) root.style.setProperty('--body-font-family', fontPresetValue(defs.bodyFontFamily, defs.bodyFontFamily));
  if(defs.headingFontFamily != null) root.style.setProperty('--heading-font-family', fontPresetValue(defs.headingFontFamily, defs.headingFontFamily));
  if(defs.heroEyebrowFontSize != null) root.style.setProperty('--hero-eyebrow-font-size', `${Number(defs.heroEyebrowFontSize)}px`);
  if(defs.heroTitleFontSize != null) root.style.setProperty('--hero-title-font-size', `${Number(defs.heroTitleFontSize)}px`);
  if(defs.heroSubtitleFontSize != null) root.style.setProperty('--hero-subtitle-font-size', `${Number(defs.heroSubtitleFontSize)}px`);
  if(defs.heroTitleFontFamily != null) root.style.setProperty('--hero-title-font-family', fontPresetValue(defs.heroTitleFontFamily, defs.heroTitleFontFamily));
  if(defs.partKickerFontSize != null) root.style.setProperty('--part-kicker-font-size', `${Number(defs.partKickerFontSize)}px`);
  if(defs.partTitleFontSize != null) root.style.setProperty('--part-title-font-size', `${Number(defs.partTitleFontSize)}px`);
  if(defs.partTitleFontFamily != null) root.style.setProperty('--part-title-font-family', fontPresetValue(defs.partTitleFontFamily, defs.partTitleFontFamily));
  if(defs.sectionHeadingFontSize != null) root.style.setProperty('--section-heading-font-size', `${Number(defs.sectionHeadingFontSize)}px`);
  if(defs.sectionHeadingFontFamily != null) root.style.setProperty('--section-heading-font-family', fontPresetValue(defs.sectionHeadingFontFamily, defs.sectionHeadingFontFamily));
  if(defs.noteFontSize != null) root.style.setProperty('--note-font-size', `${Number(defs.noteFontSize)}px`);
  if(defs.noteLineHeight != null) root.style.setProperty('--note-line-height', String(defs.noteLineHeight));
  if(defs.noteLabelFontSize != null) root.style.setProperty('--note-label-font-size', `${Number(defs.noteLabelFontSize)}px`);
  if(defs.captionFontSize != null) root.style.setProperty('--caption-font-size', `${Number(defs.captionFontSize)}px`);
  if(defs.calloutFontSize != null) root.style.setProperty('--callout-font-size', `${Number(defs.calloutFontSize)}px`);
  if(defs.calloutTitleFontSize != null) root.style.setProperty('--callout-title-font-size', `${Number(defs.calloutTitleFontSize)}px`);
  if(defs.calloutLabelFontSize != null) root.style.setProperty('--callout-label-font-size', `${Number(defs.calloutLabelFontSize)}px`);
  if(defs.calloutChipFontSize != null) root.style.setProperty('--callout-chip-font-size', `${Number(defs.calloutChipFontSize)}px`);
  if(defs.calloutObserveTitleFontSize != null) root.style.setProperty('--callout-observe-title-font-size', `${Number(defs.calloutObserveTitleFontSize)}px`);
}
function mountBook(loaded){
  const validation=BookCore.validateData(loaded);
  if(!validation.ok) throw new Error(validation.errors.join(' '));
  const normalized=BookCore.normalizeData(loaded);
  sourceBookData = normalized;
  const data=BookCore.expandScreenSequences(normalized);
  bookData = data;
  const defs=data.layoutDefaults || {};
  document.title = getLoc(data.meta,'title','Βιβλίο');
  applyLayoutDefaults(defs);
  applyScreenScale();
  applyPrintPageSettings(defs);
  renderPages(data);
  deriveNav(data);
  updateActiveNav();
  requestAnimationFrame(updateReaderScrollNav);
  setStatus(`${contentLang==='en' ? 'Pages' : 'Σελίδες'}: ${(data.pages||[]).length}`);
  localBookLoader.hidden=true;
  window.BookAuthorRuntime=Object.freeze({
    protocol:'book-author-v2',
    bookSource:bookSourceUrl?.toString() || null,
    bookBase:bookBaseUrl.toString(),
    schema:data.schemaVersion,
    directV4:BookCore.isV4Data(data),
    renderer:BookCore.VERSION
  });
}
async function boot(){
  applyScreenScale();
  mountBook(await loadData());
}
boot().catch(err=>{
  console.error(err);
  setStatus('Δεν έγινε αυτόματη φόρτωση. Επίλεξε το αρχείο του βιβλίου.');
  localBookLoader.hidden=false;
});
localBookInput?.addEventListener('change',async event=>{
  const file=event.target.files?.[0];
  if(!file) return;
  try{
    bookSourceUrl=null;
    bookBaseUrl=new URL('.', window.location.href);
    mountBook(JSON.parse(await file.text()));
  }catch(err){
    console.error(err);
    setStatus(`Σφάλμα στο αρχείο βιβλίου: ${err.message}`);
  }
});
</script>
