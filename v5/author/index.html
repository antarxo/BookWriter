<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ΣΥΓΓΡΑΦΕΑΣ v5 — Render Once</title>
<style>
html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#1f2933;color:#fff}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
#v5bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#17202a;border-bottom:1px solid #46515c}
#v5bar strong{white-space:nowrap}
#v5bar button{padding:7px 11px;border:1px solid #74808c;border-radius:4px;background:#f7f7f7;color:#111;cursor:pointer}
#v5bar button:disabled{opacity:.5;cursor:default}
#v5bar label{display:flex;align-items:center;gap:6px;min-width:0}
#bookBase{width:360px;max-width:36vw;padding:6px}
#status{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d7e1ea}
#authorFrame{width:100%;height:100%;border:0;background:white}
</style>
</head>
<body>
<div id="v5bar">
  <strong>BookWriter v5</strong>
  <button id="capture" type="button">Καταγραφή rendered HTML</button>
  <label>Base βιβλίου <input id="bookBase" placeholder="π.χ. ../../books/book_new/"></label>
  <span id="status">φόρτωση Author 4.5…</span>
</div>
<iframe id="authorFrame" src="../../author/index.html" title="BookWriter Author 4.5"></iframe>
<script src="../core/snapshot/render-snapshot.js"></script>
<script src="snapshot-author-bridge.js"></script>
<script src="shell.js"></script>
</body>
</html>
