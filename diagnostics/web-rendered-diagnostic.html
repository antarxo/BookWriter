<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Rendered Snapshot Diagnostic</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;background:#eee;color:#111}.bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #bbb;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar button,.bar input{font:inherit}.status{font-family:ui-monospace,monospace}.viewport{padding:18px;overflow:auto}.frame-shell{display:inline-block;background:white;box-shadow:0 0 0 1px #aaa}iframe{border:0;display:block;background:white}.report{padding:8px 18px;background:#fff;border-bottom:1px solid #ccc;white-space:pre-wrap}
</style>
</head><body>
<div class="bar"><input id="htmlFile" type="file" accept=".html,.htm,text/html"><button id="folderBtn" disabled>Επιλογή φακέλου & απόδοση</button><label>Viewport <input id="vw" type="number" value="1200" min="320" style="width:75px">×<input id="vh" type="number" value="900" min="320" style="width:75px"></label><button id="saveBtn" disabled>Snapshot JSON</button><span id="status" class="status"></span></div>
<div id="report" class="report">Επίλεξε πρώτα το αποθηκευμένο HTML και μετά τον φάκελο που περιέχει το HTML και τον συνοδευτικό _files.</div>
<div class="viewport"><div class="frame-shell"><iframe id="preview"></iframe></div></div>
<script src="../core/v4/web-rendered-core-v4.js?v=rendered-snapshot-002"></script>
<script>
(()=>{let htmlFile=null,snapshot=null;const $=s=>document.querySelector(s),status=$('#status'),report=$('#report'),frame=$('#preview');
$('#htmlFile').addEventListener('change',e=>{htmlFile=e.target.files?.[0]||null;$('#folderBtn').disabled=!htmlFile;status.textContent=htmlFile?'HTML: '+htmlFile.name:''});
$('#folderBtn').addEventListener('click',async()=>{if(!htmlFile)return;if(typeof showDirectoryPicker!=='function'){alert('Ο browser δεν υποστηρίζει showDirectoryPicker.');return}try{status.textContent='Διαβάζω φάκελο…';const handle=await showDirectoryPicker({mode:'read'}),files=await WebRenderedCoreV4.collectDirectoryFiles(handle),htmlPath=WebRenderedCoreV4.findHtmlPath(files,htmlFile.name);if(!htmlPath)throw Error('Ο φάκελος δεν περιέχει το επιλεγμένο HTML.');status.textContent='Αποδίδω με Chromium…';snapshot=await WebRenderedCoreV4.renderPackage({files,htmlPath,frame,viewportWidth:+$('#vw').value,viewportHeight:+$('#vh').value});$('#saveBtn').disabled=false;const c=snapshot.counts;report.textContent=`Rendered snapshot OK\nHTML: ${htmlPath}\nVersion: ${snapshot.version}\nDocument: ${Math.round(snapshot.document.width)}×${Math.round(snapshot.document.height)} px\nElements: ${c.elements}\nText runs: ${c.textRuns}\nImages: ${c.images}\nBackground images: ${c.backgrounds}\nAssets referenced: ${(snapshot.assets||[]).length}\nZero-sized elements: ${c.zeroSized??0}\nUnresolved resources: ${snapshot.unresolvedResources.length}${snapshot.unresolvedResources.length?'\n'+snapshot.unresolvedResources.slice(0,20).join('\n'):''}`;status.textContent='Έτοιμο';}catch(err){console.error(err);status.textContent='Αποτυχία';report.textContent=err?.stack||String(err)}});
$('#saveBtn').addEventListener('click',()=>{if(!snapshot)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}));a.download='web-rendered-snapshot.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
})();
</script></body></html>
