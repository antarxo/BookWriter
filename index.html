<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BookWriter — Βιβλιοθήκη</title>
  <style>
    :root{color-scheme:light;--ink:#17232d;--muted:#60717d;--line:#d7e0e6;--blue:#1f5f8b;--blue2:#eaf4fa;--paper:#fff;--bg:#f4f7f9;--ok:#176b48;--warn:#8a5415}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    main{width:min(1120px,calc(100% - 32px));margin:28px auto 48px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
    h1{margin:0;color:var(--blue);font-size:clamp(32px,5vw,52px);line-height:1}
    .lead{margin:9px 0 0;color:var(--muted);font-size:18px}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
    button,a.button{appearance:none;border:1px solid #bdd0dc;border-radius:11px;background:var(--paper);color:#18384a;padding:10px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    button.primary,a.primary{background:var(--blue);border-color:var(--blue);color:white}
    button:hover,a.button:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(31,95,139,.12)}
    .status{margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted)}
    .status.ok{border-color:#b9d8c9;color:var(--ok);background:#f4fbf7}
    .status.warn{border-color:#ead2aa;color:var(--warn);background:#fffaf1}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:17px}
    article{display:flex;flex-direction:column;min-height:205px;padding:21px;border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:0 12px 35px rgba(27,45,58,.07)}
    article h2{margin:0 0 8px;color:#18384a;font-size:22px;line-height:1.2}
    article p{margin:0 0 14px;color:var(--muted)}
    .id{margin-top:auto;padding-top:12px;border-top:1px solid #e8edf0;color:#87949d;font:13px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
    .card-actions{display:flex;gap:9px;margin-top:15px}
    .card-actions a{flex:1;text-align:center;border:1px solid #c9d8e1;border-radius:10px;padding:9px;text-decoration:none;color:#1f5f8b;font-weight:700;background:#f8fbfd}
    .card-actions a:first-child{background:var(--blue2)}
    .empty{padding:32px;border:1px dashed #b8c7d0;border-radius:16px;text-align:center;color:var(--muted);background:#fff}
    footer{margin-top:28px;color:#7a8892;font-size:14px}
    @media(max-width:760px){header{align-items:stretch;flex-direction:column}.toolbar{justify-content:flex-start}}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>BookWriter</h1>
      <p class="lead">Βιβλιοθήκη βιβλίων</p>
    </div>
    <div class="toolbar">
      <button id="refreshBtn" type="button">Ανανέωση</button>
      <button id="syncBtn" type="button">Συγχρονισμός φακέλου books</button>
      <a class="button primary" href="author/Editor.html">Νέο βιβλίο</a>
    </div>
  </header>
  <p id="status" class="status">Φόρτωση βιβλιοθήκης…</p>
  <section id="books" class="grid" aria-live="polite"></section>
  <footer>© antarxo 2026</footer>
</main>
<script>
'use strict';
const MANIFEST_URL='books/library.json';
const MANIFEST_FILE='library.json';
const statusEl=document.getElementById('status');
const booksEl=document.getElementById('books');
const refreshBtn=document.getElementById('refreshBtn');
const syncBtn=document.getElementById('syncBtn');
function escapeHtml(value=''){
  return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function safeRelative(value=''){
  const raw=String(value).trim().replace(/\\/g,'/');
  if(!raw || raw.startsWith('/') || raw.includes('..') || /^[a-z]+:/i.test(raw)) return '';
  return raw;
}
function setStatus(text,kind=''){
  statusEl.textContent=text;
  statusEl.className=`status${kind ? ` ${kind}` : ''}`;
}
function renderBooks(list){
  const books=Array.isArray(list) ? list.filter(Boolean) : [];
  if(!books.length){
    booksEl.innerHTML='<div class="empty">Δεν βρέθηκαν καταχωρισμένα βιβλία.</div>';
    return;
  }
  booksEl.innerHTML=books.map(book=>{
    const id=escapeHtml(book.id || '');
    const title=escapeHtml(book.title || book.id || 'Χωρίς τίτλο');
    const subtitle=escapeHtml(book.subtitle || '');
    const reader=safeRelative(book.reader) || `books/${encodeURIComponent(book.id || '')}/index.html`;
    const editor=safeRelative(book.editor) || `books/${encodeURIComponent(book.id || '')}/Editor.html`;
    return `<article>
      <h2>${title}</h2>
      <p>${subtitle || 'Βιβλίο BookWriter'}</p>
      <div class="card-actions">
        <a href="${escapeHtml(reader)}">Άνοιγμα</a>
        <a href="${escapeHtml(editor)}">Επεξεργασία</a>
      </div>
      <div class="id">books/${id}/</div>
    </article>`;
  }).join('');
}
async function loadManifest(){
  try{
    const url=new URL(MANIFEST_URL,location.href);
    url.searchParams.set('_',Date.now());
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const manifest=await response.json();
    const books=Array.isArray(manifest.books) ? manifest.books : [];
    renderBooks(books);
    setStatus(`${books.length} βιβλίο${books.length===1?'':'α'} στη βιβλιοθήκη.`, 'ok');
  }catch(err){
    console.error(err);
    renderBooks([]);
    setStatus('Δεν φορτώθηκε το books/library.json. Χρησιμοποίησε «Συγχρονισμός φακέλου books».','warn');
  }
}
async function ensureReadWritePermission(handle){
  const options={mode:'readwrite'};
  if((await handle.queryPermission(options))==='granted') return true;
  return (await handle.requestPermission(options))==='granted';
}
async function readBookEntry(name,dirHandle){
  try{
    const fileHandle=await dirHandle.getFileHandle('book.json');
    const raw=await (await fileHandle.getFile()).text();
    const data=JSON.parse(raw);
    const meta=data && typeof data==='object' ? (data.meta || {}) : {};
    return {
      id:name,
      title:String(meta.title || name),
      subtitle:String(meta.subtitle || ''),
      book:`books/${name}/book.json`,
      reader:`books/${name}/index.html`,
      editor:`books/${name}/Editor.html`,
      language:String(meta.defaultLanguage || 'el')
    };
  }catch(err){
    if(err?.name!=='NotFoundError') console.warn(`Παράλειψη books/${name}/`,err);
    return null;
  }
}
async function writeManifest(booksRoot,manifest){
  const handle=await booksRoot.getFileHandle(MANIFEST_FILE,{create:true});
  const writable=await handle.createWritable();
  await writable.write(JSON.stringify(manifest,null,2));
  await writable.close();
}
async function syncFolder(){
  if(!('showDirectoryPicker' in window)){
    alert('Ο συγχρονισμός απαιτεί Chromium browser σε localhost ή HTTPS.');
    return;
  }
  try{
    const booksRoot=await window.showDirectoryPicker({mode:'readwrite',id:'bookwriter-books-root'});
    if(booksRoot.name!=='books'){
      alert('Επίλεξε ακριβώς τον φάκελο BookWriter/books/.');
      return;
    }
    if(!(await ensureReadWritePermission(booksRoot))) throw new Error('Δεν δόθηκε άδεια εγγραφής.');
    setStatus('Σάρωση των υποφακέλων του books…');
    const entries=[];
    for await(const [name,handle] of booksRoot.entries()){
      if(handle.kind!=='directory' || name.startsWith('.')) continue;
      const entry=await readBookEntry(name,handle);
      if(entry) entries.push(entry);
    }
    entries.sort((a,b)=>String(a.title).localeCompare(String(b.title),'el'));
    const manifest={schemaVersion:'book-library-v1',updatedAt:new Date().toISOString(),books:entries};
    await writeManifest(booksRoot,manifest);
    renderBooks(entries);
    setStatus(`Ο συγχρονισμός ολοκληρώθηκε: ${entries.length} βιβλίο${entries.length===1?'':'α'}.`, 'ok');
  }catch(err){
    if(err?.name==='AbortError') return;
    console.error(err);
    setStatus(`Ο συγχρονισμός απέτυχε: ${err.message || err}`,'warn');
  }
}
refreshBtn.addEventListener('click',loadManifest);
syncBtn.addEventListener('click',syncFolder);
loadManifest();
</script>
</body>
</html>
