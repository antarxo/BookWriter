<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BookWriter</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#f4f7f9;color:#18222b;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    main{width:min(760px,100%);padding:40px;border:1px solid #d7e0e6;border-radius:22px;background:#fff;box-shadow:0 18px 60px rgba(27,45,58,.10)}
    h1{margin:0 0 8px;font-size:clamp(32px,6vw,54px);line-height:1;color:#1f5f8b}
    .lead{margin:0 0 30px;color:#5b6b76;font-size:18px}
    .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    a{display:block;padding:20px;border:1px solid #cfdbe3;border-radius:16px;text-decoration:none;color:#18384a;background:#f8fbfd;transition:.15s ease}
    a:hover{transform:translateY(-2px);border-color:#1f5f8b;box-shadow:0 10px 24px rgba(31,95,139,.12)}
    strong{display:block;margin-bottom:5px;font-size:18px;color:#1f5f8b}
    span{color:#60717d}
    footer{margin-top:28px;padding-top:20px;border-top:1px solid #e3e9ed;color:#7a8892;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>BookWriter</h1>
    <p class="lead">Κοινός Συγγραφέας και ανεξάρτητα διαδραστικά βιβλία.</p>
    <div class="actions">
      <a href="books/electromagnetic_wave/">
        <strong>Βιβλίο ΗΜ κύματος</strong>
        <span>Άνοιγμα του βιβλίου στον reader.</span>
      </a>
      <a href="books/electromagnetic_wave/Editor.html">
        <strong>Συγγραφέας</strong>
        <span>Άνοιγμα του βιβλίου στο περιβάλλον επεξεργασίας.</span>
      </a>
    </div>
    <footer>© antarxo 2026</footer>
  </main>
</body>
</html>
